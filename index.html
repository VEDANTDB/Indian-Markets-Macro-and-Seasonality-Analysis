<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indian Equity Toolkit</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{--nav:#0b1f3f;--acc:#2563eb;--line:#e5e9f0;--bg:#f5f7fb;--mut:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:#0b1220;height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(120deg,#0b1f3f,#16315c);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 6px 20px -10px rgba(11,31,63,.6);z-index:5}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#60a5fa,#2563eb);display:grid;place-items:center;font-weight:700}
h1{font:700 18px Fraunces,Georgia,serif}
.sub{color:#93c5fd;font-size:11.5px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.06);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;color:#cbd5e1;padding:8px 14px;border-radius:9px;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab.on{background:#fff;color:var(--nav)}
.dl{border:1px solid rgba(255,255,255,.3);background:#2563eb;color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.dl:hover{background:#1d4ed8}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe.hid{display:none}
.foot{font-size:11px;color:var(--mut);text-align:center;padding:6px;background:#fff;border-top:1px solid var(--line)}
@media(max-width:720px){header{padding:10px}.brand{width:100%}}
</style></head><body>
<header>
  <div class="brand"><div class="logo">📊</div><div><h1>Indian Equity Toolkit</h1><div class="sub">Sector regime dashboard · Stock comparison</div></div></div>
  <nav class="tabs" role="tablist">
    <button class="tab on" data-t="dash" onclick="show('dash')">Sector Dashboard</button>
    <button class="tab" data-t="cmp" onclick="show('cmp')">Stock Compare</button>
  </nav>
  <button class="dl" onclick="getGuide()">⬇ Download guide (.docx)</button>
</header>
<main>
  <iframe id="f-dash" title="Sector Rotation Dashboard"></iframe>
  <iframe id="f-cmp" class="hid" title="Stock Compare Master"></iframe>
</main>
<div class="foot">Research tool, not investment advice. Works offline except live data fetch and CDN fonts/libraries.</div>
